name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@5a9710d5c5fd986bfbddf8b2c594d035c5152807
    with:
      setup: none
      matrix-set: full
      profiles: base,jq,python,lua,neovim,zsh,procps
      shellcheck-exclude-codes: SC1091
      shellcheck-inventory-path: .github/shellcheck-files.txt
      # Exercise relative fixture entry points with a caller's CDPATH set.
      test-command: CDPATH=. test/run
      termux-command: test/run --termux

  installed-profiles:
    name: Installed profiles
    # This overlay's own suites run without base or dotfiles-nvim installed.
    # The base gate installs this pull request's revision into the dev home
    # and runs its `dot test`, so a change that is only wrong once composed
    # fails before it lands. It tracks base main on purpose: hosts run base
    # main, so that is the combination to test.
    uses: cgraf78/dotfiles/.github/workflows/installed-profiles.yml@main # zizmor: ignore[unpinned-uses]
    with:
      dev-revision: ${{ github.event.pull_request.head.sha || github.sha }}
      # Only the dev home installs this overlay; the base and editor homes
      # never clone it, and the size budgets are base's.
      profiles: dev
      footprint: false
      # The upgrade/downgrade lifecycle, `dot doctor`, and the cross-repository
      # ownership and composition checks all install this overlay's content,
      # but base CI only runs them with this overlay at main.
      lifecycle: true
      stack: true

  provider-compatibility:
    name: Current provider compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Name checkout's throwaway initial branch so Git skips its hint.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Name checkout's throwaway initial branch so Git skips its hint.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          repository: cgraf78/checkrun
          ref: main
          path: .provider-checkouts/checkrun
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Name checkout's throwaway initial branch so Git skips its hint.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          repository: cgraf78/sley
          ref: main
          path: .provider-checkouts/sley
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Name checkout's throwaway initial branch so Git skips its hint.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          repository: cgraf78/git-tools
          ref: main
          path: .provider-checkouts/git-tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Name checkout's throwaway initial branch so Git skips its hint.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          repository: cgraf78/agentguard
          ref: main
          path: .provider-checkouts/agentguard
          persist-credentials: false
      - name: Install compatibility prerequisites
        uses: cgraf78/actions/.github/actions/shell-ci-prereqs@5a9710d5c5fd986bfbddf8b2c594d035c5152807
        with:
          matrix-name: Ubuntu
          profiles: base,jq,python,lua,neovim,zsh,procps
          setup: none
      - name: Download pinned yq compatibility runtime
        uses: cgraf78/actions/.github/actions/download-release-asset@5a9710d5c5fd986bfbddf8b2c594d035c5152807
        with:
          repository: mikefarah/yq
          tag: v4.53.6
          asset: yq_linux_amd64
          output: ${{ runner.temp }}/yq-v4.53.6
          sha256: c5f056448f973ae7d39b5401949648a78f2dc1947d6a8eb65be60d5c504b9385
          retries: "3"
      - name: Enable pinned yq compatibility runtime
        shell: bash
        run: chmod +x "$RUNNER_TEMP/yq-v4.53.6"
      - name: Download pinned Neovim compatibility runtime
        uses: cgraf78/actions/.github/actions/download-release-asset@5a9710d5c5fd986bfbddf8b2c594d035c5152807
        with:
          repository: neovim/neovim
          tag: v0.12.2
          asset: nvim-linux-x86_64.tar.gz
          output: ${{ runner.temp }}/neovim-0.12.2.tar.gz
          sha256: 31cf85945cb600d96cdf69f88bc68bec814acbff50863c5546adef3a1bcef260
          retries: "3"
      - name: Install pinned Neovim compatibility runtime
        shell: bash
        run: |-
          set -euo pipefail
          install_root="$RUNNER_TEMP/neovim-0.12.2"
          archive="$RUNNER_TEMP/neovim-0.12.2.tar.gz"
          mkdir -p "$install_root"
          tar -xzf "$archive" --strip-components=1 -C "$install_root"
          printf '%s  %s\n' \
            fe333ad1dddfeb4b15169859287369207443477288737d4b94c07df7647ae21e \
            "$install_root/bin/nvim" | sha256sum --check --strict
      - name: Download pinned Watchexec compatibility artifact
        uses: cgraf78/actions/.github/actions/download-release-asset@5a9710d5c5fd986bfbddf8b2c594d035c5152807
        with:
          repository: watchexec/watchexec
          tag: v2.7.0
          asset: watchexec-2.7.0-x86_64-unknown-linux-gnu.tar.xz
          output: ${{ runner.temp }}/watchexec-2.7.0.tar.xz
          sha256: ad226e24baa077b9d97d1a0e575a7202ed38da0e1841d4ec3ebb8c6afbf73440
          retries: "3"
      - name: Install pinned Watchexec compatibility artifact
        shell: bash
        run: |-
          set -euo pipefail
          install_root="$RUNNER_TEMP/watchexec-2.7.0"
          archive="$RUNNER_TEMP/watchexec-2.7.0.tar.xz"
          mkdir -p "$install_root"
          xz --test "$archive"
          tar -tJf "$archive" | grep -Fx \
            watchexec-2.7.0-x86_64-unknown-linux-gnu/watchexec
          tar -xJf "$archive" --strip-components=1 -C "$install_root"
          printf '%s  %s\n' \
            2590f2d13e6a5a2210f4bf3fada9542263fbcea77604921bf28aada3bc7513d1 \
            "$install_root/watchexec" | sha256sum --check --strict
      - name: Expose provider Node runtime
        shell: bash
        run: |-
          set -euo pipefail
          node_bin=$(command -v node)
          [[ $node_bin == /* && -x $node_bin && ! -d $node_bin ]]
          ln -s "$node_bin" "$RUNNER_TEMP/node-provider"
      - name: Exercise real provider contracts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOT_TEST_CHECKRUN_ROOT: ${{ github.workspace }}/.provider-checkouts/checkrun
          DOT_TEST_SLEY_ROOT: ${{ github.workspace }}/.provider-checkouts/sley
          DOT_TEST_GIT_TOOLS_ROOT: ${{ github.workspace }}/.provider-checkouts/git-tools
          DOT_TEST_AGENTGUARD_ROOT: ${{ github.workspace }}/.provider-checkouts/agentguard
          DOT_TEST_WATCHEXEC_BIN: ${{ runner.temp }}/watchexec-2.7.0/watchexec
          CAPABILITY_TEST_YQ: ${{ runner.temp }}/yq-v4.53.6
          CAPABILITY_TEST_NODE: ${{ runner.temp }}/node-provider
          CAPABILITY_TEST_NVIM: ${{ runner.temp }}/neovim-0.12.2/bin/nvim
        run: test/run --provider-compatibility

  actions-sync:
    name: cgraf78/actions sync
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Name checkout's throwaway initial branch so Git skips its hint.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
      - uses: cgraf78/actions/.github/actions/verify-consumer-sync@5a9710d5c5fd986bfbddf8b2c594d035c5152807

      - name: Verify public repository and license
        env:
          GH_TOKEN: ${{ github.token }}
        run: test/workflow-test --remote
