name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@b97bd729afec784785bd01ebd43321225ef47bb7
    with:
      setup: none
      matrix-set: full
      profiles: base,jq,python,lua,neovim,zsh,procps
      shellcheck-exclude-codes: SC1091
      shellcheck-inventory-path: .github/shellcheck-files.txt
      test-command: test/run
      termux-command: test/run --termux

  provider-compatibility:
    name: Immutable provider compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cgraf78/checkrun
          ref: 06a5e4cdf31365c4e120fab179c8214753921155
          path: .provider-checkouts/checkrun
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cgraf78/sley
          ref: f4cc2e418d47e918d1b6a1b5ca1bc05855f46279
          path: .provider-checkouts/sley
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cgraf78/git-tools
          ref: f47683ebca2cbbd3dac750f3107bb60a9ca6e65f
          path: .provider-checkouts/git-tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cgraf78/agentguard
          ref: 05b8affcbdb55e6cecb5ad412ddf34ddac0ad403
          path: .provider-checkouts/agentguard
          persist-credentials: false
      - name: Install compatibility prerequisites
        uses: cgraf78/actions/.github/actions/shell-ci-prereqs@b97bd729afec784785bd01ebd43321225ef47bb7
        with:
          matrix-name: Ubuntu
          profiles: base,jq,python,lua,neovim,zsh,procps
          setup: none
      - name: Install pinned yq compatibility runtime
        shell: bash
        run: |-
          set -euo pipefail
          yq_bin="$RUNNER_TEMP/yq-v4.53.6"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$yq_bin" \
            https://github.com/mikefarah/yq/releases/download/v4.53.6/yq_linux_amd64
          printf '%s  %s\n' \
            c5f056448f973ae7d39b5401949648a78f2dc1947d6a8eb65be60d5c504b9385 \
            "$yq_bin" | sha256sum --check --strict
          chmod +x "$yq_bin"
      - name: Install pinned Neovim compatibility runtime
        shell: bash
        run: |-
          set -euo pipefail
          install_root="$RUNNER_TEMP/neovim-0.12.2"
          archive="$RUNNER_TEMP/neovim-0.12.2.tar.gz"
          mkdir -p "$install_root"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$archive" \
            https://github.com/neovim/neovim/releases/download/v0.12.2/nvim-linux-x86_64.tar.gz
          printf '%s  %s\n' \
            31cf85945cb600d96cdf69f88bc68bec814acbff50863c5546adef3a1bcef260 \
            "$archive" | sha256sum --check --strict
          tar -xzf "$archive" --strip-components=1 -C "$install_root"
          printf '%s  %s\n' \
            fe333ad1dddfeb4b15169859287369207443477288737d4b94c07df7647ae21e \
            "$install_root/bin/nvim" | sha256sum --check --strict
      - name: Install pinned Watchexec compatibility artifact
        shell: bash
        run: |-
          set -euo pipefail
          install_root="$RUNNER_TEMP/watchexec-2.7.0"
          archive="$RUNNER_TEMP/watchexec-2.7.0.tar.xz"
          mkdir -p "$install_root"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$archive" \
            https://github.com/watchexec/watchexec/releases/download/v2.7.0/watchexec-2.7.0-x86_64-unknown-linux-gnu.tar.xz
          xz --test "$archive"
          tar -tJf "$archive" | grep -Fx \
            watchexec-2.7.0-x86_64-unknown-linux-gnu/watchexec
          tar -xJf "$archive" --strip-components=1 -C "$install_root"
          printf '%s  %s\n' \
            2590f2d13e6a5a2210f4bf3fada9542263fbcea77604921bf28aada3bc7513d1 \
            "$install_root/watchexec" | sha256sum --check --strict
      - name: Expose provider Node runtime
        shell: bash
        run: |-
          set -euo pipefail
          node_bin=$(command -v node)
          [[ $node_bin == /* && -x $node_bin && ! -d $node_bin ]]
          ln -s "$node_bin" "$RUNNER_TEMP/node-provider"
      - name: Exercise real provider contracts
        env:
          DOT_TEST_CHECKRUN_ROOT: ${{ github.workspace }}/.provider-checkouts/checkrun
          DOT_TEST_SLEY_ROOT: ${{ github.workspace }}/.provider-checkouts/sley
          DOT_TEST_GIT_TOOLS_ROOT: ${{ github.workspace }}/.provider-checkouts/git-tools
          DOT_TEST_AGENTGUARD_ROOT: ${{ github.workspace }}/.provider-checkouts/agentguard
          DOT_TEST_WATCHEXEC_BIN: ${{ runner.temp }}/watchexec-2.7.0/watchexec
          CAPABILITY_TEST_YQ: ${{ runner.temp }}/yq-v4.53.6
          CAPABILITY_TEST_NODE: ${{ runner.temp }}/node-provider
          CAPABILITY_TEST_NVIM: ${{ runner.temp }}/neovim-0.12.2/bin/nvim
        run: test/run --provider-compatibility

  actions-sync:
    name: cgraf78/actions sync
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cgraf78/actions/.github/actions/verify-consumer-sync@b97bd729afec784785bd01ebd43321225ef47bb7

      - name: Verify public repository and license
        env:
          GH_TOKEN: ${{ github.token }}
        run: test/workflow-test --remote
