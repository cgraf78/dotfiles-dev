name: Refresh Mise lock

on:
  schedule:
    # Stagger this from the broader scheduled CI and schema refresh jobs.
    - cron: "43 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    name: Refresh Dotfiles Dev Mise lock
    permissions:
      contents: write
      pull-requests: write
    uses: cgraf78/actions/.github/workflows/mise-lock-refresh.yml@b97bd729afec784785bd01ebd43321225ef47bb7
    with:
      project_name: Dotfiles Dev
      mise_config_file: home/.config/mise/config.toml
      mise_lock_file: home/.config/mise/mise.lock
    secrets:
      # Keep maintenance pushes scoped to this repository and able to trigger
      # the protected pull-request test matrix.
      deploy_key: ${{ secrets.DOTFILES_DEV_MAINTENANCE_DEPLOY_KEY }}
