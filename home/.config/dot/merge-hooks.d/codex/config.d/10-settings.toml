# Base settings shared by bare `codex` and named profiles. Model policy belongs
# only in the explicitly selected overlays under codex/profiles/<name>.d;
# config.toml leaves Codex free to preserve or choose the machine-local model,
# reasoning, verbosity, provider, and service tier.
project_doc_fallback_filenames = ["AGENTS.md", "CLAUDE.md", "CONTRIBUTING.md"]

[features]
# Opted-in feature toggles, tracked here so they survive Codex's own config
# rewrites and apply across all profiles. Codex's `= false` defaults are omitted
# on purpose; they add churn without changing behavior.
# AgentGuard's dependency-owned fragment enables native hooks separately, so
# this local policy file does not duplicate that provider-owned setting.
#
# Native memories stay explicitly off, the one deliberate `= false` here, so a
# previously merged `true` is overwritten. When on, Codex injects a
# developer-role instruction to update memories "only when explicitly asked".
# Codex read it as covering `hm` too, and because a developer message outranks
# the shared Hive Memory rule, it stopped writing `hm` memories. Its private
# store also kept Codex's lessons out of the agent-agnostic memory every other
# agent reads. Turning it off also drops Codex's private recall (the injected
# ~/.codex/memories summary), which stays on disk for review.
memories = false
goals = true
terminal_resize_reflow = true


[tui]
# AgentGuard owns attention alerts; Codex's unfocused-tab alert doubles the bell.
notifications = false
status_line = [
  "current-dir",
  "git-branch",
  "model-with-reasoning",
  "context-remaining",
  "used-tokens",
  "five-hour-limit",
  "weekly-limit",
  "fast-mode",
  "thread-title",
]
status_line_use_colors = true

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "CODEX_GITHUB_PERSONAL_ACCESS_TOKEN"
