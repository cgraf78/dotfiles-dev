# Disable Claude-compat discovery that duplicates first-class Grok surfaces.
#
# hooks: native AgentGuard lives in ~/.grok/hooks/agentguard.json. Claude
# settings.json hooks still set AGENTGUARD_NAME=claude, so Grok would run two
# copies and Claude Stop additionalContext would keep the turn alive.
# rules/agents: native home policy is ~/.grok/rules/; ~/.claude/CLAUDE.md is
# the same aggregate via compat.claude.agents, and ~/.claude/rules/ via
# compat.claude.rules.
# mcps: Claude MCP config was empty; do not inherit it. Leave skills unset
# so Grok keeps scanning Claude skills (default true). Useful plugin skills
# such as Superpowers stay enabled; only hook-bearing or Claude-only plugins
# are disabled.
#
# plugins.disabled uses the grok inspect plugin names. Claude plugin Stop
# hooks such as hookify keep the Grok turn alive even when
# compat.claude.hooks is false.
#
# The merge hook still gates hooks on ~/.grok/hooks/agentguard.json and
# rules/agents on ~/.grok/rules/agent-rules.md.
[compat.claude]
hooks = false
rules = false
agents = false
mcps = false

[plugins]
disabled = [
  "claude-code-setup",
  "claude-md-management",
  "hookify",
  "memory-sync",
  "plugin-dev",
  "ralph-loop",
  "security-guidance",
  "skill-creator",
  "status-line",
]
