# Disable bulky Claude-shaped gstack skills on Grok. Keep a short operational
# allowlist; Grok has native plan, subagent, and review. Disabled skills stay
# discovered but inactive. Names match gstack-register's gstack-* prefixes.
#
# Keep enabled (do not list): gstack-investigate, gstack-review, gstack-ship,
# gstack-health, gstack-document-generate, gstack-document-release,
# gstack-landing-report, gstack-retro.
#
# gstack-codex is disabled rather than kept as a second-opinion CLI wrapper:
# it is Claude-plan-shaped and Grok can invoke `codex` directly.

[skills]
disabled = [
  "gstack-autoplan",
  "gstack-benchmark-models",
  "gstack-canary",
  "gstack-codex",
  "gstack-cso",
  "gstack-design-consultation",
  "gstack-design-html",
  "gstack-design-review",
  "gstack-design-shotgun",
  "gstack-devex-review",
  "gstack-diagram",
  "gstack-land-and-deploy",
  "gstack-make-pdf",
  "gstack-office-hours",
  "gstack-plan-ceo-review",
  "gstack-plan-design-review",
  "gstack-plan-devex-review",
  "gstack-plan-eng-review",
  "gstack-plan-tune",
  "gstack-setup-deploy",
  "gstack-spec",
  "gstack-upgrade",
]
