# Global typos fallback. Applied via `--config` when no per-repo
# `.typos.toml` or `typos.toml` is found.
#
# Keep this intentionally small. Repo-specific dictionaries and ignore rules
# belong in the repo so spelling policy travels with the code.

[default]
extend-ignore-re = [
  # IPv6 host segments can look like short misspellings.
  "c0ba",
  # Immutable release IDs contain an abbreviated commit hash that typos can
  # split into words. Match the complete date/time/hash token, never arbitrary
  # short hex words; typos already handles full commit and checksum hashes.
  '\b[0-9]{8}-[0-9]{6}-[0-9A-Fa-f]{7,40}\b',
  # OpenSSH SHA256 key fingerprints: 43 unpadded base64 or base64url
  # characters whose short runs, such as `Nd`, can look like misspellings.
  # Both ends are bounded so glued prefixes and overlong runs stay checked;
  # the literal string keeps `\b` a regex word boundary.
  '\bSHA256:[A-Za-z0-9+/_-]{43}(?:[^A-Za-z0-9+/=_-]|$)',
]

[default.extend-words]
# Linux NFS export command, a corrections-dictionary entry for `exports`.
# Word level, unlike the table below, so `CONFIG_EXPORTFS`, `exportfs_fh`, and
# file names such as `exportfs-notes.md` stay covered.
exportfs = "exportfs"

[default.extend-identifiers]
# Makefile extension used by Checkrun filetype metadata.
mak = "mak"
# Intentional Git option abbreviation fixture.
othe = "othe"
# Pluralized hardware-token acronym.
OTPs = "OTPs"
